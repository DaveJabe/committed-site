name: Check

# Runs on pull requests: the date tests in several time zones, and a build that fails on any broken
# internal link or missing asset. It never deploys.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Build under a project path (keeps base-path support working)
        run: SITE_ORIGIN=https://davejabe.github.io SITE_BASE_PATH=/committed-site/ SITE_CUSTOM_DOMAIN=none npm run build
